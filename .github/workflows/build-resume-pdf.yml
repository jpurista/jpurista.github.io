name: Build Resume PDF

on:
  push:
    paths:
      - "resources/Resume/**"
      - "!resources/Resume/**/*.pdf"
      - "scripts/build-resume-pdf.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-resume-pdf.yml"
  pull_request:
    paths:
      - "resources/Resume/**"
      - "!resources/Resume/**/*.pdf"
      - "scripts/build-resume-pdf.cjs"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/build-resume-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: resume-pdf-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.ref || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install PDF renderer
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Generate resume PDFs
        run: npm run build:resume

      - name: Commit and push updated PDFs
        if: github.event_name != 'pull_request'
        env:
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Refresh source if another commit arrived during setup.
          git restore resources/Resume/Juan_Pablo_Urista_Resume.pdf resources/Juan_Pablo_Urista_Resume.pdf
          git pull --ff-only origin "$BRANCH_NAME"
          npm run build:resume
          git add resources/Resume/Juan_Pablo_Urista_Resume.pdf resources/Juan_Pablo_Urista_Resume.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Auto-update resume PDFs"
            git push origin "HEAD:$BRANCH_NAME"
          fi

      - name: Upload PDF preview
        uses: actions/upload-artifact@v4
        with:
          name: resume-pdf
          path: resources/Resume/Juan_Pablo_Urista_Resume.pdf
          if-no-files-found: error

      - name: Rebuild GitHub Pages with the updated PDFs
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        # GITHUB_TOKEN commits do not trigger a Pages build automatically.
        run: gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
